# Render this manifest after Terraform creates RDS, for example:
# export RDS_ENDPOINT=$(terraform -chdir=terraform output -raw rds_endpoint)
# export RDS_PORT=$(terraform -chdir=terraform output -raw rds_port)
# export RDS_DB_NAME=$(terraform -chdir=terraform output -raw rds_db_name)
# envsubst < k8s/backend-configmap.yaml | kubectl apply -f -
apiVersion: v1
kind: ConfigMap
metadata:
  name: titan-backend-config
  namespace: titan
  labels:
    app.kubernetes.io/name: titan-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: project-titan
data:
  DB_HOST: "${RDS_ENDPOINT}"
  DB_PORT: "${RDS_PORT}"
  DB_NAME: "${RDS_DB_NAME}"
  SPRING_DATASOURCE_URL: "jdbc:mysql://${RDS_ENDPOINT}:${RDS_PORT}/${RDS_DB_NAME}?useSSL=true&requireSSL=true&allowPublicKeyRetrieval=true"
