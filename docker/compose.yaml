name: titan-3tier

services:
  database:
    build:
      context: ./docker
      dockerfile: database.Dockerfile
    image: rushi-maridb:latest
    container_name: titan-database
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:-root123}
      MARIADB_DATABASE: ${MARIADB_DATABASE:-student_db}
      MARIADB_USER: ${MARIADB_USER:-rushi}
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:-rushi123}
    ports:
      - "${DATABASE_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mariadb-admin ping -h 127.0.0.1 -u root -p$$MARIADB_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - titan

  backend:
    build:
      context: ./docker
      dockerfile: backend.Dockerfile
      args:
        EASYCRUD_REPO: ${EASYCRUD_REPO:-https://github.com/rushidholecom/EasyCRUD.git}
        EASYCRUD_REF: ${EASYCRUD_REF:-main}
    image: rushi-backend:latest
    container_name: titan-backend
    environment:
      DB_HOST: database
      DB_PORT: 3306
      DB_NAME: ${MARIADB_DATABASE:-student_db}
      DB_USERNAME: ${MARIADB_USER:-rushi}
      DB_PASSWORD: ${MARIADB_PASSWORD:-rushi123}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - titan

  frontend:
    build:
      context: ./docker
      dockerfile: frontend.Dockerfile
      args:
        EASYCRUD_REPO: ${EASYCRUD_REPO:-https://github.com/rushidholecom/EasyCRUD.git}
        EASYCRUD_REF: ${EASYCRUD_REF:-main}
    image: rushi-frontend:latest
    container_name: titan-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - titan

volumes:
  mariadb_data:

networks:
  titan:
    driver: bridge
